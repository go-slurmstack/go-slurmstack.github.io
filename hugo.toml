baseURL = "https://go-slurmstack.github.io/"
title = "go-slurmstack"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- styles.html, theme-toggle.html, fork-ribbon.html and
# icons/{github,book}.html -- comes from the shared Hugo module
# github.com/go-fleettools/landingkit, pinned in go.mod; kit.go keeps
# `go mod tidy` from deleting it. Never copy those partials here: a file of
# the same name under layouts/partials/ silently overrides the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

# What the cluster is made of, drawn from terraform/*.tf and ansible/site.yml.
# "what" says what the node does; nothing here is a count to keep in step.
[[params.nodes]]
  name = "frontend"
  what = "Login node, `slurmctld` in configless mode, and a glauth LDAP directory serving the cluster's people over LDAPS to every node. The only server with a floating IP, and only port 22 open, to `allowed_ssh_cidrs`."

[[params.nodes]]
  name = "software"
  what = "gcc 13 (C, C++, Fortran) and Lmod from Ubuntu on every node; a site-wide Spack on a shared volume builds OpenMPI 5 and gmsh as its own account — pinned release, pinned recipes, never root. `module load openmpi gmsh`, then `srun --mpi=pmix` across the workers."

[[params.nodes]]
  name = "directory"
  what = "People listed once in `users.yaml` become Linux users everywhere through SSSD: NSS, PAM and SSH keys from glauth, over LDAPS signed by the cluster's own CA. Logins by key only — no password stored anywhere. Operators manage jobs and workers through `sudo slurmop`, and nothing else."

[[params.nodes]]
  name = "nfs"
  what = "Exports `/srv/home` — a Cinder volume, unless `nfs_volume_size = 0` — to the private subnet only, with `root_squash`. The frontend and the workers mount it as `/home`."

[[params.nodes]]
  name = "workers"
  what = "`slurmd`, with no local `slurm.conf`. `CPUs` and `RealMemory` come from each worker's own facts, with headroom, so a node is never drained for claiming memory it does not have."

[[params.repos]]
  name = "slurmstack"
  kind = "tool"
  type = "tool"
  ci = false
  godoc = false
  cov = "n/a"
  blurb = "Terraform for the network, the router, the floating IP and the servers; go-ansible's engine, in process, for munge, NFS and Slurm. One static binary."

[params.brand]
# Generated by go-fleettools/landingkit from brand/svg/color/slurmstack.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 8.98:1, bright on the dark background 7.10:1.
  base = "#5b21b6"
  deep = "#38146f"
  bright = "#a78bfa"
  shadow = "rgba(91,33,182,.7)"
  glow = "rgba(91,33,182,.6)"
  wash = "rgba(91,33,182,.10)"
  washDeep = "rgba(56,20,111,.06)"
  chipBg = "#f4f1fe"
  chipBorder = "#e5dcfe"
  chipFg = "#38146f"
  chipBgDark = "rgba(167,139,250,.14)"
  chipBorderDark = "rgba(167,139,250,.32)"
  chipFgDark = "#cfbffc"
  statsEnd = "#eae3fe"
  bandText = "#f1ecfe"
